# SPDX-License-Identifier: AGPL-3.0-only

openapi: 3.1.0
info:
  title: FeastCloud Core API
  version: 0.1.0
  description: Phase 0 tenant-safe organization, kitchen, order, audit, and edge-inbox API.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: http://localhost:8080
tags:
  - name: Platform
  - name: Organization
  - name: Kitchen
  - name: Commerce
  - name: Guest
  - name: Analytics
  - name: Operations
  - name: Commerce
  - name: Audit
  - name: Sync
paths:
  /healthz:
    get:
      tags: [Platform]
      operationId: health
      security: []
      responses:
        "200":
          description: The process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [Platform]
      operationId: readiness
      security: []
      responses:
        "200":
          description: The process is ready to receive traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1:
    get:
      tags: [Platform]
      operationId: discoverV1
      security: []
      responses:
        "200":
          description: V1 resource discovery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /api/v1/organizations:
    get:
      tags: [Organization]
      operationId: listOrganizations
      parameters:
        - $ref: "#/components/parameters/TenantFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/Collection"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Organization]
      operationId: createOrganization
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MutationEnvelope"
                - type: object
                  properties:
                    payload:
                      $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/organizations/{id}:
    get:
      tags: [Organization]
      operationId: getOrganization
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TenantFilter"
      responses:
        "200":
          $ref: "#/components/responses/Entity"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/outlets:
    get:
      tags: [Organization]
      operationId: listOutlets
      parameters:
        - $ref: "#/components/parameters/TenantFilter"
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Organization]
      operationId: createOutlet
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        $ref: "#/components/requestBodies/Mutation"
      responses:
        "201": { $ref: "#/components/responses/Created" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/outlets/{id}:
    get:
      tags: [Organization]
      operationId: getOutlet
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TenantFilter"
      responses:
        "200": { $ref: "#/components/responses/Entity" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/brands:
    get:
      tags: [Organization]
      operationId: listBrands
      parameters:
        - $ref: "#/components/parameters/TenantFilter"
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Organization]
      operationId: createBrand
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/brands/{id}:
    get:
      tags: [Organization]
      operationId: getBrand
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TenantFilter"
      responses:
        "200": { $ref: "#/components/responses/Entity" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/brand-outlet-assignments:
    get:
      tags: [Organization]
      operationId: listBrandOutletAssignments
      description: Lists controlled brand deployments. A brand is not sellable at an outlet until an active assignment exists.
      parameters:
        - $ref: "#/components/parameters/TenantFilter"
        - name: brandId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OutletFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Organization]
      operationId: setBrandOutletAssignment
      description: Creates a controlled brand deployment or changes its active state. Updates require the current record version; create uses expectedVersion 0.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MutationEnvelope"
                - type: object
                  properties:
                    payload: { $ref: "#/components/schemas/BrandOutletAssignmentInput" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "200": { $ref: "#/components/responses/Entity" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/platform/tenants:
    post:
      tags: [Platform]
      operationId: provisionTenant
      description: >-
        FeastCloud-operator-only onboarding command. It atomically creates a
        customer tenant, organization root, first outlet, first brand, active
        outlet rollout, and template stations. Requires the platform_admin role.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MutationEnvelope"
                - type: object
                  properties:
                    payload: { $ref: "#/components/schemas/TenantProvisionInput" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/stations:
    get:
      tags: [Kitchen]
      operationId: listStations
      parameters:
        - $ref: "#/components/parameters/TenantFilter"
        - $ref: "#/components/parameters/OutletFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Kitchen]
      operationId: createStation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/stations/{id}:
    get:
      tags: [Kitchen]
      operationId: getStation
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TenantFilter"
      responses:
        "200": { $ref: "#/components/responses/Entity" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/orders:
    get:
      tags: [Commerce]
      operationId: listOrders
      parameters:
        - $ref: "#/components/parameters/TenantFilter"
        - $ref: "#/components/parameters/OutletFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Commerce]
      operationId: createOrder
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/orders/{id}:
    get:
      tags: [Commerce]
      operationId: getOrder
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TenantFilter"
      responses:
        "200": { $ref: "#/components/responses/Entity" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/orders/{id}/transitions:
    post:
      tags: [Commerce]
      operationId: transitionOrderStatus
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        $ref: "#/components/requestBodies/OrderTransition"
      responses:
        "200": { $ref: "#/components/responses/Entity" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/kitchen-tickets:
    get:
      tags: [Kitchen]
      operationId: listKitchenTickets
      parameters:
        - $ref: "#/components/parameters/TenantFilter"
        - $ref: "#/components/parameters/OutletFilter"
        - name: orderId
          in: query
          schema: { type: string, format: uuid }
        - name: stationId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Kitchen]
      operationId: createKitchenTicket
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/kitchen-tickets/{id}:
    get:
      tags: [Kitchen]
      operationId: getKitchenTicket
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TenantFilter"
      responses:
        "200": { $ref: "#/components/responses/Entity" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/kitchen-tickets/{id}/transitions:
    post:
      tags: [Kitchen]
      operationId: transitionKitchenTicketStatus
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        $ref: "#/components/requestBodies/TicketTransition"
      responses:
        "200": { $ref: "#/components/responses/Entity" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      parameters:
        - $ref: "#/components/parameters/TenantFilter"
        - $ref: "#/components/parameters/OutletFilter"
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/units:
    get:
      tags: [Kitchen]
      operationId: listUnits
      responses: { "200": { $ref: "#/components/responses/Collection" }, default: { $ref: "#/components/responses/Problem" } }
    post:
      tags: [Kitchen]
      operationId: createUnit
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "201": { $ref: "#/components/responses/Created" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/ingredients:
    get:
      tags: [Kitchen]
      operationId: listIngredients
      responses: { "200": { $ref: "#/components/responses/Collection" }, default: { $ref: "#/components/responses/Problem" } }
    post:
      tags: [Kitchen]
      operationId: createIngredient
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "201": { $ref: "#/components/responses/Created" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/recipes:
    get:
      tags: [Kitchen]
      operationId: listRecipes
      responses: { "200": { $ref: "#/components/responses/Collection" }, default: { $ref: "#/components/responses/Problem" } }
    post:
      tags: [Kitchen]
      operationId: createRecipe
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "201": { $ref: "#/components/responses/Created" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/recipes/{id}/versions:
    post:
      tags: [Kitchen]
      operationId: addRecipeVersion
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "201": { $ref: "#/components/responses/Created" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/menu-items:
    get:
      tags: [Commerce]
      operationId: listMenuItems
      parameters: [{ $ref: "#/components/parameters/OutletFilter" }]
      responses: { "200": { $ref: "#/components/responses/Collection" }, default: { $ref: "#/components/responses/Problem" } }
    post:
      tags: [Commerce]
      operationId: createMenuItem
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "201": { $ref: "#/components/responses/Created" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/inventory-events:
    post:
      tags: [Kitchen]
      operationId: appendInventoryEvent
      description: Appends immutable receiving, waste, spoilage, transfer, production, staff-meal, or reversal evidence. Physical counts use the atomic inventory-counts workflow.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "201": { $ref: "#/components/responses/Created" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/inventory-counts:
    post:
      tags: [Kitchen]
      operationId: completeInventoryCount
      description: Records immutable physical-count evidence and atomically posts costed variance adjustments against the current ledger balance.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "201": { $ref: "#/components/responses/Created" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/inventory-summary:
    get:
      tags: [Kitchen]
      operationId: inventorySummary
      parameters: [{ $ref: "#/components/parameters/OutletFilter" }]
      responses: { "200": { $ref: "#/components/responses/Collection" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/production-batches:
    get:
      tags: [Kitchen]
      operationId: listProductionBatches
      parameters: [{ $ref: "#/components/parameters/OutletFilter" }]
      responses: { "200": { $ref: "#/components/responses/Collection" }, default: { $ref: "#/components/responses/Problem" } }
    post:
      tags: [Kitchen]
      operationId: planProductionBatch
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "201": { $ref: "#/components/responses/Created" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/production-batches/{id}/transitions:
    post:
      tags: [Kitchen]
      operationId: transitionProductionBatch
      description: Starts, completes, or cancels a batch using expectedVersion. Completion consumes the fixed recipe version and receives actual yield into inventory atomically.
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "200": { $ref: "#/components/responses/Entity" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/order-imports:
    get:
      tags: [Commerce]
      operationId: listOrderImports
      parameters: [{ $ref: "#/components/parameters/OutletFilter" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses: { "200": { $ref: "#/components/responses/Collection" }, default: { $ref: "#/components/responses/Problem" } }
    post:
      tags: [Commerce]
      operationId: importCsvOrders
      description: Records file fingerprint and row-level reconciliation evidence while creating valid orders, recipe snapshots, and station tickets atomically.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "201": { $ref: "#/components/responses/Created" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/menu-imports:
    get:
      tags: [Commerce]
      operationId: listMenuImportDrafts
      description: Returns immutable third-party menu imports. The latest applied import is the active sellable menu; recipe and station links remain optional and may be completed later.
      parameters: [{ $ref: "#/components/parameters/OutletFilter" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses: { "200": { $ref: "#/components/responses/Collection" }, default: { $ref: "#/components/responses/Problem" } }
    post:
      tags: [Commerce]
      operationId: applyMenuImport
      description: Idempotently saves and activates a canonical menu export using its source checksum. Re-uploading the same canonical menu returns the existing import.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "201": { $ref: "#/components/responses/Created" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/planning-runs:
    get:
      tags: [Analytics]
      operationId: listPlanningRuns
      parameters: [{ $ref: "#/components/parameters/OutletFilter" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses: { "200": { $ref: "#/components/responses/Collection" }, default: { $ref: "#/components/responses/Problem" } }
    post:
      tags: [Analytics]
      operationId: generatePlanningRun
      description: Persists observe-only demand forecasts, preparation suggestions, stockout warnings, evidence, confidence, and model version.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "201": { $ref: "#/components/responses/Created" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/dashboard/daily:
    get:
      tags: [Analytics]
      operationId: getDailyManagerDashboard
      description: Returns a PostgreSQL ledger-backed manager dashboard for one outlet-local calendar date. Receipt, order, and tender event cohorts remain explicitly separate; unsupported channel and leakage facts are named in unavailableFields.
      parameters:
        - name: outletId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: A tenant- and outlet-scoped daily dashboard read snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyDashboardEnvelope" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/configuration-snapshots:
    get:
      tags: [Operations]
      operationId: listConfigurationSnapshots
      parameters: [{ $ref: "#/components/parameters/OutletFilter" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses: { "200": { $ref: "#/components/responses/Collection" }, default: { $ref: "#/components/responses/Problem" } }
    post:
      tags: [Operations]
      operationId: publishSignedConfigurationSnapshot
      description: Canonicalizes and signs an immutable outlet configuration snapshot with Ed25519.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "201": { $ref: "#/components/responses/Created" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/edge-checkpoints:
    get:
      tags: [Operations]
      operationId: listEdgeSyncCheckpoints
      parameters: [{ $ref: "#/components/parameters/OutletFilter" }]
      responses: { "200": { $ref: "#/components/responses/Collection" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/reconciliation-cases:
    get:
      tags: [Operations]
      operationId: listReconciliationCases
      parameters: [{ $ref: "#/components/parameters/OutletFilter" }]
      responses: { "200": { $ref: "#/components/responses/Collection" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/reconciliation-cases/{id}/actions:
    post:
      tags: [Operations]
      operationId: actOnReconciliationCase
      description: Assigns, retries, resolves, dismisses, or reopens a case using expectedVersion.
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "200": { $ref: "#/components/responses/Entity" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/incidents:
    get:
      tags: [Operations]
      operationId: listOperationalIncidents
      parameters: [{ $ref: "#/components/parameters/OutletFilter" }]
      responses: { "200": { $ref: "#/components/responses/Collection" }, default: { $ref: "#/components/responses/Problem" } }
    post:
      tags: [Operations]
      operationId: reportOperationalIncident
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "201": { $ref: "#/components/responses/Created" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/incidents/{id}/actions:
    post:
      tags: [Operations]
      operationId: transitionOperationalIncident
      description: Moves an incident through open, monitoring, and resolved states using expectedVersion.
      parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/Mutation" }
      responses: { "200": { $ref: "#/components/responses/Entity" }, default: { $ref: "#/components/responses/Problem" } }
  /api/v1/backup-evidence:
    get:
      tags: [Operations]
      operationId: listBackupAndRestoreEvidence
      responses: { "200": { $ref: "#/components/responses/Entity" }, default: { $ref: "#/components/responses/Problem" } }
    post:
      tags: [Operations]
      operationId: recordBackupManifest
