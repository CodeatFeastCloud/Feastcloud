    OrderInput:
      type: object
      additionalProperties: false
      required: [id, outletId, type, lines, subtotal, discountTotal, taxTotal, serviceCharge, total, placedAt]
      properties:
        id: { type: string, format: uuid }
        outletId: { type: string, format: uuid }
        brandId: { type: string, format: uuid }
        externalRef: { type: string }
        type: { type: string, enum: [dineIn, takeaway, delivery, roomService] }
        status: { type: string, enum: [received, accepted, preparing, ready, completed, cancelled] }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [id, name, quantity, unitPrice, lineTotal]
            properties:
              id: { type: string, format: uuid }
              menuItemId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer, minimum: 1 }
              unitPrice: { $ref: "#/components/schemas/Money" }
              lineTotal: { $ref: "#/components/schemas/Money" }
              preparationNote: { type: string }
        subtotal: { $ref: "#/components/schemas/Money" }
        discountTotal: { $ref: "#/components/schemas/Money" }
        taxTotal: { $ref: "#/components/schemas/Money" }
        serviceCharge: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        placedAt: { type: string, format: date-time }
    KitchenTicketInput:
      type: object
      additionalProperties: false
      required: [id, outletId, orderId, stationId, lineIds, priority]
      properties:
        id: { type: string, format: uuid }
        outletId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        stationId: { type: string, format: uuid }
        lineIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        status: { type: string, enum: [queued, fired, preparing, ready, completed, cancelled] }
        priority: { type: integer, minimum: 0, maximum: 100 }
        targetAt: { type: string, format: date-time }
    PushOperationsRequest:
      type: object
      additionalProperties: false
      required: [batchId, edgeId, outletId, operations]
      properties:
        batchId: { type: string, minLength: 1, maxLength: 128 }
        edgeId: { type: string, minLength: 1, maxLength: 128 }
        outletId: { type: string, minLength: 1, maxLength: 128 }
        operations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [operationId, aggregateType, aggregateId, aggregateVersion, commandType, mutation]
            properties:
              operationId: { type: string, format: uuid }
              aggregateType: { type: string }
              aggregateId: { type: string, format: uuid }
              aggregateVersion: { type: integer, format: int64, minimum: 0 }
              commandType: { type: string }
              mutation: { $ref: "#/components/schemas/MutationEnvelope" }
              recordedAt: { type: string, format: date-time }
    PushOperationsResponse:
      type: object
      required: [batchId, results]
      properties:
        batchId: { type: string }
        results:
          type: array
          items:
            type: object
            required: [operationId, status]
            properties:
              operationId: { type: string, format: uuid }
              status:
                type: string
                enum: [ACCEPTED, DUPLICATE, REJECTED, CONFLICT, RETRY]
                description: ACCEPTED and DUPLICATE are emitted only after durable cloud commit.
              problemCode:
                type: string
                description: Stable rejection, conflict, or retry reason.
              retryAfterSeconds: { type: integer, minimum: 1 }
