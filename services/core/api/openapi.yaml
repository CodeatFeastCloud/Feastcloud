    get: { tags: [Guest], operationId: listLoyaltyAccounts, responses: { "200": { $ref: "#/components/responses/Collection" }, default: { $ref: "#/components/responses/Problem" } } }
  /api/v1/loyalty-accounts/{id}/events:
    post: { tags: [Guest], operationId: adjustLoyalty, parameters: [{ $ref: "#/components/parameters/ResourceID" }, { $ref: "#/components/parameters/IdempotencyKey" }], requestBody: { $ref: "#/components/requestBodies/Mutation" }, responses: { "201": { $ref: "#/components/responses/Created" }, default: { $ref: "#/components/responses/Problem" } } }
  /api/v1/devices:
    post:
      tags: [Platform]
      operationId: enrollOutletDevice
      description: Enrolls an outlet edge certificate fingerprint. Owner or manager role required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MutationEnvelope" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/revoke:
    post:
      tags: [Platform]
      operationId: revokeOutletDevice
      description: Revokes an enrolled certificate immediately. Owner or manager role required.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MutationEnvelope" }
      responses:
        "200": { $ref: "#/components/responses/Entity" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v1/sync/operations:
    post:
      tags: [Sync]
      operationId: pushOperations
      security:
        - OutletDeviceCertificate: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushOperationsRequest"
      responses:
        "200":
          description: >-
            One result per operation. PostgreSQL-backed core returns ACCEPTED only after
            inbox evidence and its append-only domain event commit atomically. An exact
            replay returns DUPLICATE; an unconfigured or unavailable store returns RETRY.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushOperationsResponse"
        default: { $ref: "#/components/responses/Problem" }
security:
  - OIDC: []
components:
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://identity.example/.well-known/openid-configuration
      description: Production mode validates RS256 issuer, audience, tenant, role, outlet, and lifetime claims.
    OutletDeviceCertificate:
      type: mutualTLS
      description: Enrolled outlet device certificate; revocation is checked in PostgreSQL on each sync request.
    DemoTenant:
      type: apiKey
      in: header
      name: X-FeastCloud-Tenant-ID
      description: Phase 0 adapter only; production uses OIDC and device certificates.
    DemoActor:
      type: apiKey
      in: header
      name: X-FeastCloud-Actor-ID
      description: Phase 0 adapter only; production derives the actor from authentication.
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantFilter:
      name: tenantId
      in: query
      description: Optional assertion; when present it must match the authenticated tenant.
      schema: { type: string, maxLength: 128 }
    OutletFilter:
      name: outletId
      in: query
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 256 }
    CorrelationID:
      name: X-Correlation-ID
      in: header
      schema: { type: string, format: uuid }
  requestBodies:
    Mutation:
      required: true
      content:
        application/json:
          schema:
              $ref: "#/components/schemas/MutationEnvelope"
    OrderTransition:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/MutationEnvelope"
              - type: object
                properties:
                  payload: { $ref: "#/components/schemas/OrderTransitionInput" }
    TicketTransition:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/MutationEnvelope"
              - type: object
                properties:
                  payload: { $ref: "#/components/schemas/TicketTransitionInput" }
  responses:
    Created:
      description: Resource created. Replays preserve the business result and set Idempotency-Replayed.
      headers:
        Location:
          schema: { type: string }
        Idempotency-Replayed:
          schema: { type: boolean }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ResponseEnvelope" }
    Entity:
      description: A tenant-scoped entity.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ResponseEnvelope" }
    Collection:
      description: A cursor-paginated tenant-scoped collection.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CollectionEnvelope" }
    Problem:
      description: Stable machine-readable problem details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Health:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string }
        service: { type: string }
        version: { type: string }
        time: { type: string, format: date-time }
    MutationEnvelope:
      $ref: "../../../packages/contracts/schemas/mutation-envelope.json"
    ResponseEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          type: object
          required: [requestId]
          properties:
            requestId: { type: string }
            idempotencyReplay: { type: boolean }
    CollectionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: {} }
        meta:
          type: object
          required: [requestId, page]
          properties:
            requestId: { type: string }
            page:
              type: object
              required: [limit]
              properties:
                limit: { type: integer }
                nextCursor: { type: string }
    Problem:
      type: object
      required: [type, title, status, detail, code, messageKey, correlationId, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        messageKey: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean }
        violations:
          type: array
          items:
            type: object
            required: [field, code, messageKey]
            properties:
              field: { type: string }
              code: { type: string }
              messageKey: { type: string }
    DailyDashboardEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/DailyDashboard" }
    DailyDashboard:
      type: object
      additionalProperties: false
      required: [outletId, businessDate, currency, timeZone, period, asOf, sales, paymentFlow, orders, tenderMix, fulfillmentMix, hourly, leakage, topItems, dataQuality, provenance, unavailableFields]
      properties:
        outletId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        timeZone: { type: string }
        period:
          type: object
          additionalProperties: false
          required: [startsAt, endsAt, boundaryKind]
          properties:
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            boundaryKind: { type: string, const: outlet_local_calendar_day }
        asOf: { type: string, format: date-time }
        sales:
          $ref: "#/components/schemas/DashboardSales"
        paymentFlow:
          $ref: "#/components/schemas/DashboardPaymentFlow"
        orders:
          $ref: "#/components/schemas/DashboardOrders"
        tenderMix:
          type: array
          items: { $ref: "#/components/schemas/DashboardTenderMix" }
        fulfillmentMix:
          type: array
          items: { $ref: "#/components/schemas/DashboardFulfillmentMix" }
        hourly:
          type: array
          items: { $ref: "#/components/schemas/DashboardHourly" }
        leakage:
          $ref: "#/components/schemas/DashboardLeakage"
        topItems:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/DashboardTopItem" }
        dataQuality:
          $ref: "#/components/schemas/DashboardDataQuality"
        provenance:
          type: object
          additionalProperties: false
          required: [sales, orders, payments, promotions, topItems]
          properties:
            sales: { type: string }
            orders: { type: string }
            payments: { type: string }
            promotions: { type: string }
            topItems: { type: string }
        unavailableFields:
          type: array
          items: { type: string }
    DashboardSales:
      type: object
      additionalProperties: false
      required: [receiptedOrderCount, subtotalMinor, discountMinor, taxMinor, serviceChargeMinor, totalMinor]
      properties:
        receiptedOrderCount: { type: integer, format: int64, minimum: 0 }
        subtotalMinor: { type: integer, format: int64, minimum: 0 }
        discountMinor: { type: integer, format: int64, minimum: 0 }
        taxMinor: { type: integer, format: int64, minimum: 0 }
        serviceChargeMinor: { type: integer, format: int64, minimum: 0 }
        totalMinor: { type: integer, format: int64, minimum: 0 }
    DashboardPaymentFlow:
      type: object
      additionalProperties: false
      required: [capturedCount, capturedMinor, refundCount, refundMinor, netMinor]
      properties:
        capturedCount: { type: integer, format: int64, minimum: 0 }
        capturedMinor: { type: integer, format: int64, minimum: 0 }
        refundCount: { type: integer, format: int64, minimum: 0 }
        refundMinor: { type: integer, format: int64, minimum: 0 }
        netMinor: { type: integer, format: int64 }
    DashboardOrders:
      type: object
      additionalProperties: false
      required: [total, included, completed, cancelled, active, unpriced, subtotalMinor, discountMinor, taxMinor, serviceChargeMinor, orderValueMinor, averageOrderValueMinor]
      properties:
        total: { type: integer, format: int64, minimum: 0 }
        included: { type: integer, format: int64, minimum: 0 }
